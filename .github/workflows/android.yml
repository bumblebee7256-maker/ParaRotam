name: ParaRotam APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ParaRotam_Hazir_Kaynak.zip'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract current source
        run: |
          mkdir -p build-source
          unzip -q -o ParaRotam_Hazir_Kaynak.zip -d build-source
      - name: Build APK
        working-directory: build-source
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ParaRotam-APK
          path: build-source/app/build/outputs/apk/debug/*.apk
