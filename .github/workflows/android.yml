name: ParaRotam APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ParaRotam_Android_v2_2_Kaynak.zip'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract Android project
        run: unzip -q ParaRotam_Android_v2_2_Kaynak.zip
      - name: Build debug APK
        working-directory: ParaRotam_Android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ParaRotam-APK
          path: ParaRotam_Android/app/build/outputs/apk/debug/app-debug.apk
